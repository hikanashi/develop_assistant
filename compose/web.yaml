# フロントエンド (Next.js 開発サーバー)
services:
  web:
    build:
      context: ../web
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    working_dir: /app
    # インストール完了時だけマーカーを作る。途中で停止して node_modules が壊れていても、
    # マーカーがなければ中身を消して入れ直す (壊れたネイティブバイナリは npm が検出できない)
    command:
      - sh
      - -c
      - |
        set -e
        hash=$$(sha256sum package-lock.json | cut -d' ' -f1)
        if [ ! -f "node_modules/.installed-$$hash" ]; then
          find node_modules -mindepth 1 -delete
          npm install --no-audit --no-fund
          touch "node_modules/.installed-$$hash"
        fi
        exec npm run dev -- -H 0.0.0.0
    restart: unless-stopped
    # クラッシュ時のコアダンプ (数百MB) をリポジトリ内に残さない
    ulimits:
      core: 0
    environment:
      BACKEND_URL: http://backend:8000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ../web:/app
      # ホストの node_modules と分離する
      - web_node_modules:/app/node_modules
    depends_on:
      backend:
        condition: service_healthy
    # インストール完了と起動を待てるようにする (docker compose up --wait)
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 5s
      timeout: 30s
      retries: 20
      start_period: 120s

volumes:
  web_node_modules:
