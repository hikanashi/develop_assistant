services:
  db:
    image: postgres:18
    restart: unless-stopped
    # 認証情報は必須の .env から読み込む。
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      # PostgreSQL 18 以降は /var/lib/postgresql 配下にマウントする
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
