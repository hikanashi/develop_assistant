name: develop_assistant

# DB はルートの compose と同じ定義を使う
include:
  - ../compose/db.yaml

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    command: sleep infinity
    user: vscode
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    volumes:
      - ..:/workspaces/develop_assistant:cached
      # コンテナ内から commit/push させない
      - ../.git:/workspaces/develop_assistant/.git:ro
    # 認証情報は .env から読み込む。psql 用の PG* 変数は post-create.sh が ~/.bashrc に設定する
    env_file:
      - ../.env
    environment:
      POSTGRES_HOST: db
    depends_on:
      db:
        condition: service_healthy
